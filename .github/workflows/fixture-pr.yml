name: Create disposable PR
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        required: true
        options: [passing, failing, workflow-change, controller-change]
permissions: {}
jobs:
  fixture:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SCENARIO: ${{ inputs.scenario }}
        with:
          script: |
            // Probe only this harmless diagnostic run, never an upstream run.
            try {
              await github.rest.actions.approveWorkflowRun({...context.repo, run_id: context.runId});
              core.warning('Built-in token approval returned success on a non-gated diagnostic run');
            } catch (error) {
              core.info(`Built-in token approval probe: ${error.status}: ${error.message}`);
              if (error.status !== 403) throw error;
            }
            const scenario = process.env.SCENARIO;
            if (!['passing','failing','workflow-change','controller-change'].includes(scenario))
              throw new Error('Unknown fixture');
            if (scenario === 'workflow-change') {
              const {data: pull} = await github.rest.pulls.create({...context.repo,
                head: 'fixture/workflow-change-44268585130', base: 'master',
                title: 'Disposable CI fixture: workflow-change',
                body: 'Temporary workflow-change fixture. This PR will be closed without merging.'});
              core.info(JSON.stringify({number: pull.number, url: pull.html_url, scenario}));
              return;
            }
            const {data: base} = await github.rest.repos.getBranch({...context.repo, branch: 'master'});
            const branch = `fixture/${scenario}-${context.runId}`;
            await github.rest.git.createRef({...context.repo, ref: `refs/heads/${branch}`, sha: base.commit.sha});
            let path = 'validation-fixture.txt';
            let suffix = `Disposable ${scenario} fixture ${context.runId}\n`;
            if (scenario === 'failing') {
              path = 'SConstruct';
              suffix = '\nraise RuntimeError("Intentional trusted-PR-CI failure fixture")\n';
            } else if (scenario === 'workflow-change') {
              path = '.github/workflows/package-linux.yml';
              suffix = '\n# A PR workflow change must remain held.\n';
            } else if (scenario === 'controller-change') {
              path = '.github/scripts/select-pr-ci.cjs';
              suffix = '\nthrow new Error("PR controller code must never execute");\n';
            }
            let previous = '', sha;
            if (scenario !== 'passing') {
              const {data: file} = await github.rest.repos.getContent({...context.repo, path, ref: base.commit.sha});
              previous = Buffer.from(file.content, 'base64').toString(); sha = file.sha;
            }
            const change = await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch,
              message: `Fixture: ${scenario}`, content: Buffer.from(previous + suffix).toString('base64'), sha});
            const {data: pull} = await github.rest.pulls.create({...context.repo, head: branch, base: 'master',
              title: `Disposable CI fixture: ${scenario}`,
              body: 'Temporary automated validation fixture. This PR will be closed without merging.'});
            core.info(JSON.stringify({number: pull.number, url: pull.html_url, head: change.data.commit.sha, scenario}));
